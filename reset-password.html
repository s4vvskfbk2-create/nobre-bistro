<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset de Senha - Nobre Café</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #8B1A1A 0%, #A52A2A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #8B1A1A;
      margin-bottom: 10px;
      text-align: center;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #8B1A1A;
      box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #8B1A1A;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #A52A2A;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Reset de Senha</h1>
    <p class="subtitle">Nobre Café - Admin</p>

    <div class="info">
      ⚠️ Esta página atualiza a senha diretamente no Supabase.
    </div>

    <form id="form">
      <div class="form-group">
        <label for="nova_senha">Nova Senha do Admin:</label>
        <input type="password" id="nova_senha" name="nova_senha" placeholder="Ex: Adm123" required>
      </div>

      <button type="submit" id="btn_reset">
        Atualizar Senha
      </button>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://zxpnguynjrsixsomaieg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4cG5ndXluanJzaXhzb21haWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODkyNDAsImV4cCI6MjA5NjE2NTI0MH0.3_6a8Hn0xQe6FEbjVTeRnKZUwRD64Fe_0Jsk-pGHP3Q";

    const form = document.getElementById('form');
    const novaSenhaInput = document.getElementById('nova_senha');
    const btnReset = document.getElementById('btn_reset');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const novaSenha = novaSenhaInput.value.trim();

      if (!novaSenha) {
        showMessage('Por favor, digite a nova senha', 'error');
        return;
      }

      btnReset.disabled = true;
      btnReset.textContent = 'Atualizando...';
      messageDiv.style.display = 'none';

      try {
        // Atualizar senha no Supabase via RPC
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/reset_admin_password`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({
              new_password: novaSenha
            })
          }
        );

        if (response.ok) {
          showMessage('✅ Senha atualizada com sucesso! Nova senha: ' + novaSenha, 'success');
          novaSenhaInput.value = '';
        } else {
          const error = await response.json();
          showMessage('❌ Erro ao atualizar: ' + (error.message || 'Tente novamente'), 'error');
        }
      } catch (err) {
        showMessage('❌ Erro de conexão: ' + err.message, 'error');
      } finally {
        btnReset.disabled = false;
        btnReset.textContent = 'Atualizar Senha';
      }
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
