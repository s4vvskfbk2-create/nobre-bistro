<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desbloquear Admin - Nobre Café</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #8B1A1A 0%, #A52A2A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #8B1A1A;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #8B1A1A;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #A52A2A;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .link {
      margin-top: 20px;
    }
    .link a {
      color: #8B1A1A;
      text-decoration: none;
      font-weight: 600;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔓 Desbloquear Admin</h1>
    <p class="subtitle">Nobre Café</p>

    <div id="info" class="message info">
      ⏳ Você está bloqueado por excesso de tentativas de login.
    </div>

    <div id="success" class="message success">
      ✅ Bloqueio removido com sucesso! Você pode fazer login agora.
    </div>

    <button id="btn" onclick="desbloquear()">
      🔓 Desbloquear Agora
    </button>

    <div class="link">
      <a href="admin.html">Voltar ao Login →</a>
    </div>
  </div>

  <script>
    function desbloquear() {
      const btn = document.getElementById('btn');
      const info = document.getElementById('info');
      const success = document.getElementById('success');

      try {
        // Remove o bloqueio de força bruta
        localStorage.removeItem('nb_bA_loginAttempts');

        // Mostra sucesso
        btn.style.display = 'none';
        info.style.display = 'none';
        success.style.display = 'block';

        // Redireciona após 2 segundos
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 2000);
      } catch (err) {
        alert('Erro ao desbloquear: ' + err.message);
      }
    }
  </script>
</body>
</html>
